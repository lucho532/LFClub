#009-T025       requestBody:
#009-T025         required: true
#009-T025         content:
#009-T025           application/json:
#009-T025             schema: { $ref: '#/components/schemas/ResponderDto' }
#009-T025       responses:
#009-T025         '200':
#009-T025           description: Guardada
#009-T025           content:
#009-T025             application/json:
#009-T025               schema: { $ref: '#/components/schemas/PartidoDto' }
#009-T025         '400': { $ref: '#/components/responses/Validacion' }
#009-T025         '401': { $ref: '#/components/responses/SinSesion' }
#009-T025         '403': { $ref: '#/components/responses/NoAutorizado' }
#009-T025         '404': { $ref: '#/components/responses/NoEncontrado' }
#009-T025         '409': { $ref: '#/components/responses/EstadoNoPermite' }

  # ------------------------------------------------------------------ Estadísticas

#009-T026   /api/clubes/{clubId}/jugadores/{usuarioRolId}/estadisticas:
#009-T026     parameters:
#009-T026       - $ref: '#/components/parameters/clubId'
#009-T026       - $ref: '#/components/parameters/usuarioRolId'
#009-T026     get:
#009-T026       tags: [Estadisticas]
#009-T026       summary: NUEVO. Estadísticas del jugador, en total y por categoría
#009-T026       description: Quien puede ver su ficha (`AccesoAFicha` de la 005); los demás, 404 (RF-028).
#009-T026       responses:
#009-T026         '200':
#009-T026           description: Las estadísticas; en cero si no hay registros
#009-T026           content:
#009-T026             application/json:
#009-T026               schema: { $ref: '#/components/schemas/EstadisticasJugadorDto' }
#009-T026         '401': { $ref: '#/components/responses/SinSesion' }
#009-T026         '403': { $ref: '#/components/responses/NoAutorizado' }
#009-T026         '404': { $ref: '#/components/responses/NoEncontrado' }

#009-T027   /api/clubes/{clubId}/goleadores:
#009-T027     parameters:
#009-T027       - $ref: '#/components/parameters/clubId'
#009-T027     get:
#009-T027       tags: [Estadisticas]
#009-T027       summary: NUEVO. Goleadores del club por categoría
#009-T027       description: |
#009-T027         Cualquier rol (RF-029). Con `categoriaId`, los goleadores de esa categoría, contando los
#009-T027         goles marcados con ella aunque el jugador ya esté en otra (escenario 6.4) e incluyendo
#009-T027         retirados (6.5). Sin él, solo las categorías que tienen goles, para elegir.
#009-T027       parameters:
#009-T027         - { name: categoriaId, in: query, required: false, schema: { type: string, format: uuid } }
#009-T027       responses:
#009-T027         '200':
#009-T027           description: Los goleadores
#009-T027           content:
#009-T027             application/json:
#009-T027               schema: { $ref: '#/components/schemas/GoleadoresDto' }
#009-T027         '401': { $ref: '#/components/responses/SinSesion' }
#009-T027         '403': { $ref: '#/components/responses/NoAutorizado' }
#009-T027         '404': { $ref: '#/components/responses/NoEncontrado' }

components:
  securitySchemes:
    sesion:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    clubId:
      name: clubId
      in: path
      required: true
      schema: { type: string, format: uuid }
    usuarioRolId:
      name: usuarioRolId
      in: path
      required: true
      schema: { type: string, format: uuid }
    entrenamientoId:
      name: entrenamientoId
      in: path
      required: true
      schema: { type: string, format: uuid }
    partidoId:
      name: partidoId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    SinSesion:
      description: Sin sesión o sesión no válida
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
    NoAutorizado:
      description: |
        Los 403 de la pertenencia al club, `rol_no_autorizado` y `no_gestiona_actividad`
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
    NoEncontrado:
      description: '`no_encontrado`: no existe, es de otro club o quien pregunta no puede verlo'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
    Validacion:
      description: '`datos_invalidos` con `errores` por campo'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
    EstadoNoPermite:
      description: |
        `actividad_cancelada`, `actividad_no_cancelada`, `actividad_empezada`, `entrenamiento_futuro`,
        `partido_sin_empezar`, `partido_jugado`, `categoria_inactiva`, `categorias_no_cambian` o
        `jugador_fuera_de_la_actividad`
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }

  schemas:
    Problema:
      type: object
      required: [codigo, title, status]
      properties:
        codigo: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        errores:
          type: object
          additionalProperties:
            type: array
            items: { type: string }

    EstadoEntrenamiento:
      type: string
      enum: [PROGRAMADO, CANCELADO]
    EstadoPartido:
      type: string
      enum: [PROXIMO, CANCELADO, JUGADO]
    CondicionPartido:
      type: string
      enum: [LOCAL, VISITANTE]
    TipoPartido:
      type: string
      enum: [AMISTOSO, TORNEO]
    RespuestaFamilia:
      type: string
      enum: [ASISTIRA, NO_ASISTIRA]

    Hora:
      type: string
      pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'

    CategoriaDeActividadDto:
      type: object
      additionalProperties: false
      required: [categoriaId, anio]
      properties:
        categoriaId: { type: string, format: uuid }
        anio: { type: integer }

    EnlaceFichaDto:
      description: El de la spec 008; `null` donde quien mira no puede abrir la ficha
      type: object
      required: [tipo, usuarioRolId]
      properties:
        tipo: { type: string, enum: [JUGADOR, BASICA] }
        usuarioRolId: { type: string, format: uuid }

    UltimoCambioDto:
      description: El de la spec 008
      type: object
      required: [fecha, autor, porLaCuentaDelJugador]
      properties:
        fecha: { type: string, format: date-time }
        autor: { type: string }
        porLaCuentaDelJugador: { type: boolean, description: Siempre falso aquí }
        autorFicha:
          oneOf: [{ $ref: '#/components/schemas/EnlaceFichaDto' }, { type: 'null' }]

    PermisosDeActividadDto:
      type: object
      additionalProperties: false
      required: [gestiona, vePlanilla, responde]
      properties:
        gestiona: { type: boolean, description: Puede cambiar, cancelar, reactivar, convocar y registrar el resultado }
        vePlanilla: { type: boolean, description: Puede pedir `.../jugadores` }
        responde: { type: boolean, description: Es la cuenta de un jugador que todavía puede responder }

    # ---------------------------------------------------------------- Entrenamientos

    GuardarEntrenamientoDto:
      type: object
      additionalProperties: false
      required: [fecha, horaInicio, horaFin, lugar, categoriaIds]
      properties:
        fecha: { type: string, format: date }
        horaInicio: { $ref: '#/components/schemas/Hora' }
        horaFin: { $ref: '#/components/schemas/Hora', description: Posterior a horaInicio }
        lugar: { type: string, minLength: 1, maxLength: 120 }
        nota: { type: [string, 'null'], maxLength: 500 }
        categoriaIds:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, format: uuid }

    EntrenamientoResumenDto:
      type: object
      additionalProperties: false
      required: [entrenamientoId, fecha, horaInicio, horaFin, lugar, estado, categorias]
      properties:
        entrenamientoId: { type: string, format: uuid }
        fecha: { type: string, format: date }
        horaInicio: { $ref: '#/components/schemas/Hora' }
        horaFin: { $ref: '#/components/schemas/Hora' }
        lugar: { type: string }
        estado: { $ref: '#/components/schemas/EstadoEntrenamiento' }
        categorias:
          type: array
          items: { $ref: '#/components/schemas/CategoriaDeActividadDto' }
        miRespuesta:
          description: Solo para la cuenta de un jugador; ausente si no respondió
          allOf: [{ $ref: '#/components/schemas/RespuestaFamilia' }]

    EntrenamientoDto:
      allOf:
        - $ref: '#/components/schemas/EntrenamientoResumenDto'
        - type: object
          required: [permisos]
          properties:
            nota: { type: [string, 'null'] }
            permisos: { $ref: '#/components/schemas/PermisosDeActividadDto' }
            miAsistencia:
              type: boolean
              description: Solo para la cuenta de un jugador con asistencia registrada; presente o ausente

    RegistrarAsistenciaDto:
      type: object
      additionalProperties: false
      required: [jugadores]
      properties:
        jugadores:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [usuarioRolId, presente]
            properties:
              usuarioRolId: { type: string, format: uuid }
              presente: { type: boolean }

    PlanillaEntrenamientoDto:
      type: object
      additionalProperties: false
      required: [entrenamientoId, sinResponder, asistiran, noAsistiran, jugadores]
      properties:
        entrenamientoId: { type: string, format: uuid }
        asistiran: { type: integer }
        noAsistiran: { type: integer }
        sinResponder: { type: integer }
        jugadores:
          type: array
          description: Por categoría y apellidos
          items:
            type: object
            additionalProperties: false
            required: [usuarioRolId, nombres, apellidos, categoria, marcable]
            properties:
              usuarioRolId: { type: string, format: uuid }
              nombres: { type: string }
              apellidos: { type: string }
              enlace:
                oneOf: [{ $ref: '#/components/schemas/EnlaceFichaDto' }, { type: 'null' }]
              categoria: { $ref: '#/components/schemas/CategoriaDeActividadDto' }
              respuesta:
                oneOf: [{ $ref: '#/components/schemas/RespuestaFamilia' }, { type: 'null' }]
              presente:
                type: [boolean, 'null']
                description: null si nadie registró su asistencia
              marcable: { type: boolean }

    # ---------------------------------------------------------------- Partidos

    GuardarPartidoDto:
      type: object
      additionalProperties: false
      required: [rival, fecha, hora, lugar, condicion, tipo, categoriaIds]
      properties:
        rival: { type: string, minLength: 1, maxLength: 120 }
        fecha: { type: string, format: date }
        hora: { $ref: '#/components/schemas/Hora' }
        lugar: { type: string, minLength: 1, maxLength: 120 }
        condicion: { $ref: '#/components/schemas/CondicionPartido' }
        tipo: { $ref: '#/components/schemas/TipoPartido' }
        nombreTorneo:
          type: [string, 'null']
          maxLength: 120
          description: Obligatorio si tipo es TORNEO; se ignora en un amistoso
        categoriaIds:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, format: uuid }

    GoleadorDePartidoDto:
      type: object
      additionalProperties: false
      required: [nombres, apellidos, goles]
      properties:
        nombres: { type: string }
        apellidos: { type: string }
        goles: { type: integer, minimum: 1 }
        enlace:
          oneOf: [{ $ref: '#/components/schemas/EnlaceFichaDto' }, { type: 'null' }]

    PartidoResumenDto:
      type: object
      additionalProperties: false
      required: [partidoId, rival, fecha, hora, lugar, condicion, tipo, estado, faltaResultado, categorias]
      properties:
        partidoId: { type: string, format: uuid }
        rival: { type: string }
        fecha: { type: string, format: date }
        hora: { $ref: '#/components/schemas/Hora' }
        lugar: { type: string }
        condicion: { $ref: '#/components/schemas/CondicionPartido' }
        tipo: { $ref: '#/components/schemas/TipoPartido' }
        nombreTorneo: { type: [string, 'null'] }
        estado: { $ref: '#/components/schemas/EstadoPartido' }
        faltaResultado: { type: boolean, description: PROXIMO que ya empezó }
        golesClub: { type: [integer, 'null'] }
        golesRival: { type: [integer, 'null'] }
        categorias:
          type: array
          items: { $ref: '#/components/schemas/CategoriaDeActividadDto' }
        miRespuesta:
          description: Solo para la cuenta de un jugador convocado que respondió
          allOf: [{ $ref: '#/components/schemas/RespuestaFamilia' }]

    PartidoDto:
      allOf:
        - $ref: '#/components/schemas/PartidoResumenDto'
        - type: object
          required: [permisos]
          properties:
            permisos: { $ref: '#/components/schemas/PermisosDeActividadDto' }
            goleadores:
              type: array
              description: Solo en un partido JUGADO, para todos
              items: { $ref: '#/components/schemas/GoleadorDePartidoDto' }
            ultimoCambioResultado:
              description: Solo en un partido JUGADO y para quien ve la planilla
              allOf: [{ $ref: '#/components/schemas/UltimoCambioDto' }]

    GuardarConvocatoriaDto:
      type: object
      additionalProperties: false
      required: [usuarioRolIds]
      properties:
        usuarioRolIds:
          type: array
          uniqueItems: true
          description: Puede ir vacía (caso límite de la spec)
          items: { type: string, format: uuid }

    RegistrarResultadoDto:
      type: object
      additionalProperties: false
      required: [golesClub, golesRival, jugadores]
      properties:
        golesClub: { type: integer, minimum: 0, maximum: 99 }
        golesRival: { type: integer, minimum: 0, maximum: 99 }
        jugadores:
          type: array
          description: Cada convocado; los que no se envían quedan como que no jugaron y sin goles
          items:
            type: object
            additionalProperties: false
            required: [usuarioRolId, jugo, goles]
            properties:
              usuarioRolId: { type: string, format: uuid }
              jugo: { type: boolean }
              goles: { type: integer, minimum: 0, maximum: 99 }

    PlanillaPartidoDto:
      type: object
      additionalProperties: false
      required: [partidoId, asistiran, noAsistiran, sinResponder, convocados, convocables]
      properties:
        partidoId: { type: string, format: uuid }
        asistiran: { type: integer }
        noAsistiran: { type: integer }
        sinResponder: { type: integer }
        convocados:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [usuarioRolId, nombres, apellidos, categoria, jugo, goles]
            properties:
              usuarioRolId: { type: string, format: uuid }
              nombres: { type: string }
              apellidos: { type: string }
              enlace:
                oneOf: [{ $ref: '#/components/schemas/EnlaceFichaDto' }, { type: 'null' }]
              categoria:
                description: La copiada al convocarlo
                allOf: [{ $ref: '#/components/schemas/CategoriaDeActividadDto' }]
              respuesta:
                oneOf: [{ $ref: '#/components/schemas/RespuestaFamilia' }, { type: 'null' }]
              jugo: { type: boolean }
              goles: { type: integer }
        convocables:
          type: array
          description: Jugadores activos de sus categorías que no están convocados; vacía si no está PROXIMO
          items:
            type: object
            additionalProperties: false
            required: [usuarioRolId, nombres, apellidos, categoria]
            properties:
              usuarioRolId: { type: string, format: uuid }
              nombres: { type: string }
              apellidos: { type: string }
              categoria: { $ref: '#/components/schemas/CategoriaDeActividadDto' }

    # ---------------------------------------------------------------- Comunes

    ResponderDto:
      type: object
      additionalProperties: false
      required: [respuesta]
      properties:
        respuesta: { $ref: '#/components/schemas/RespuestaFamilia' }

    CalendarioDto:
      type: object
      additionalProperties: false
      required: [desde, hasta, entrenamientos, partidos]
      properties:
        desde: { type: string, format: date }
        hasta: { type: string, format: date }
        entrenamientos:
          type: array
          items: { $ref: '#/components/schemas/EntrenamientoResumenDto' }
        partidos:
          type: array
          items: { $ref: '#/components/schemas/PartidoResumenDto' }

    # ---------------------------------------------------------------- Estadísticas

    CifrasDto:
      type: object
      additionalProperties: false
      required: [partidosJugados, goles, entrenamientosRegistrados, entrenamientosAsistidos, porcentajeAsistencia]
      properties:
        partidosJugados: { type: integer }
        goles: { type: integer }
        entrenamientosRegistrados: { type: integer }
        entrenamientosAsistidos: { type: integer }
        porcentajeAsistencia: { type: integer, minimum: 0, maximum: 100, description: 0 si no hay registros }

    EstadisticasJugadorDto:
      type: object
      additionalProperties: false
      required: [usuarioRolId, total, porCategoria]
      properties:
        usuarioRolId: { type: string, format: uuid }
        total: { $ref: '#/components/schemas/CifrasDto' }
        porCategoria:
          type: array
          description: Por año descendente; vacía si no hay registros
          items:
            allOf:
              - $ref: '#/components/schemas/CifrasDto'
              - type: object
                required: [categoria]
                properties:
                  categoria: { $ref: '#/components/schemas/CategoriaDeActividadDto' }

    GoleadoresDto:
      type: object
      additionalProperties: false
      required: [categoriasConGoles, goleadores]
      properties:
        categoriasConGoles:
          type: array
          description: Categorías con al menos un gol registrado, por año descendente
          items: { $ref: '#/components/schemas/CategoriaDeActividadDto' }
        categoria:
          description: La elegida; ausente sin `categoriaId`
          allOf: [{ $ref: '#/components/schemas/CategoriaDeActividadDto' }]
        goleadores:
          type: array
          description: De mayor a menor; vacía sin `categoriaId`. Solo nombre, goles y enlace (RF-029)
          items: { $ref: '#/components/schemas/GoleadorDePartidoDto' }
