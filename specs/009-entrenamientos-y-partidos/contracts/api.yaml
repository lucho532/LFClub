openapi: 3.1.0
info:
  title: La Pecosa - API de la funcionalidad 009 (entrenamientos, partidos y estadísticas)
  version: 0.9.0
  description: |
    Contrato de lo que esta funcionalidad añade respecto de los contratos de la 001 a la 008. Lo
    que no aparece aquí sigue igual. Añade 22 endpoints, todos bajo `/api/clubes/{clubId}`: el
    contrato completo pasa de 72 a 94, y los de club de 48 a 70. No cambia ninguna respuesta
    existente.

    Convenciones (las de las specs anteriores):
    - Todos los errores usan `application/problem+json` con un campo `codigo` estable.
    - `/api/clubes/{clubId}/**` exige un integrante del usuario en ese club. Sin él, también el
      DESARROLLADOR, responde 404 `no_encontrado`.
    - Tras decidir quién hace la petición (cabecera `X-Jugador-Elegido` de la 006) se aplica lo de
      siempre: 403 `club_suspendido`, `club_dado_de_baja`, `ingreso_en_espera`,
      `integrante_retirado` o `rol_no_autorizado`.
    - Un entrenamiento o un partido que no existe, que es de otro club o que quien pregunta no puede
      ver responde 404 `no_encontrado`, sin distinguir los casos (RF-011). Para una cuenta no
      convocada, un partido próximo no existe.
    - Quien ve una actividad pero no la gestiona (no entrena todas sus categorías y no es
      PRESIDENTE) recibe 403 `no_gestiona_actividad` al intentar cambiarla (escenario 2.7).
    - Fechas `YYYY-MM-DD` y horas `HH:mm`, en hora de Colombia (research §2).
    - Una cuenta de jugador nunca recibe convocados, quiénes jugaron, ni respuestas o asistencias
      de otros jugadores: esas partes se omiten del JSON, no van vacías (RF-012, RF-024).

servers:
  - url: http://localhost:8080

security:
  - sesion: []

tags:
  - name: Calendario
  - name: Entrenamientos
  - name: Partidos
  - name: Estadisticas

# Mientras se construye la 009, cada operación nueva lleva delante la marca `#009-T0NN` de la
# tarea que la descomenta (tasks.md, T001). Al terminar no queda ninguna (T029).

paths:
  # ------------------------------------------------------------------ Calendario

  /api/clubes/{clubId}/calendario:
    parameters:
      - $ref: '#/components/parameters/clubId'
    get:
      tags: [Calendario]
      summary: NUEVO. Entrenamientos y partidos que quien pregunta puede ver en un rango
      description: |
        Cualquier rol. Rango de hasta 62 días, ambos incluidos. Aplica la visibilidad de research §4:
        los partidos próximos o cancelados solo si quien pregunta está convocado, entrena alguna de
        sus categorías o es PRESIDENTE.
      parameters:
        - { name: desde, in: query, required: true, schema: { type: string, format: date } }
        - { name: hasta, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200':
          description: Actividades del rango, por fecha y hora
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CalendarioDto' }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/SinSesion' }
        '403': { $ref: '#/components/responses/NoAutorizado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  # ------------------------------------------------------------------ Entrenamientos

  /api/clubes/{clubId}/entrenamientos:
    parameters:
      - $ref: '#/components/parameters/clubId'
    post:
      tags: [Entrenamientos]
      summary: NUEVO. Programa un entrenamiento para una o varias categorías
      description: |
        PRESIDENTE, DIRECTIVO o ENTRENADOR (los demás, 403 `rol_no_autorizado`). Quien no es
        PRESIDENTE debe entrenar todas las categorías elegidas (RF-002); si no, 403
        `no_gestiona_actividad`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GuardarEntrenamientoDto' }
      responses:
        '201':
          description: Programado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EntrenamientoDto' }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/SinSesion' }
        '403': { $ref: '#/components/responses/NoAutorizado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409':
          description: '`categoria_inactiva`: una de las categorías no está activa o no es del club'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }

  /api/clubes/{clubId}/entrenamientos/proximos:
    parameters:
      - $ref: '#/components/parameters/clubId'
    get:
      tags: [Entrenamientos]
      summary: NUEVO. Hasta 5 entrenamientos visibles que no han terminado, para el inicio
      description: Cualquier rol (RF-006). Incluye los cancelados, marcados (RF-004).
      responses:
        '200':
          description: Próximos entrenamientos; vacía si no hay
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/EntrenamientoResumenDto' }
        '401': { $ref: '#/components/responses/SinSesion' }
        '403': { $ref: '#/components/responses/NoAutorizado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /api/clubes/{clubId}/entrenamientos/{entrenamientoId}:
    parameters:
      - $ref: '#/components/parameters/clubId'
      - $ref: '#/components/parameters/entrenamientoId'
    get:
      tags: [Entrenamientos]
      summary: NUEVO. Detalle de un entrenamiento
      description: |
        Cualquier rol que lo ve (RF-003). La cuenta de un jugador recibe además su propia respuesta
        y su propia asistencia (escenario 4.5).
      responses:
        '200':
          description: El entrenamiento
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EntrenamientoDto' }
        '401': { $ref: '#/components/responses/SinSesion' }
        '403': { $ref: '#/components/responses/NoAutorizado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
    put:
      tags: [Entrenamientos]
      summary: NUEVO. Cambia fecha, horas, lugar y nota de un entrenamiento programado
      description: |
        Quien lo gestiona (RF-002). Las categorías del cuerpo deben ser las mismas que tiene
        (research §16.1); si no, 409 `categorias_no_cambian`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GuardarEntrenamientoDto' }
      responses:
        '200':
          description: Cambiado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EntrenamientoDto' }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/SinSesion' }
        '403': { $ref: '#/components/responses/NoAutorizado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/EstadoNoPermite' }

  /api/clubes/{clubId}/entrenamientos/{entrenamientoId}/cancelacion:
    parameters:
      - $ref: '#/components/parameters/clubId'
      - $ref: '#/components/parameters/entrenamientoId'
    post:
      tags: [Entrenamientos]
      summary: NUEVO. Cancela un entrenamiento programado
      description: |
        Quien lo gestiona. Se puede deshacer con `DELETE` mientras no haya empezado (RF-038). Ya
        cancelado, 409 `actividad_cancelada`.
      responses:
        '200':
          description: Cancelado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EntrenamientoDto' }
        '401': { $ref: '#/components/responses/SinSesion' }
        '403': { $ref: '#/components/responses/NoAutorizado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/EstadoNoPermite' }
    delete:
      tags: [Entrenamientos]
      summary: NUEVO. Reactiva un entrenamiento cancelado
      description: |
        Quien lo gestiona, mientras no haya empezado y sus categorías sigan activas (RF-038).
        Vuelve a PROGRAMADO con sus categorías y las respuestas como estaban. Si no
        está cancelado, 409 `actividad_no_cancelada`; si ya empezó, `actividad_empezada`; con una
        categoría desactivada, `categoria_inactiva`.
      responses:
        '200':
          description: Reactivado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EntrenamientoDto' }
        '401': { $ref: '#/components/responses/SinSesion' }
        '403': { $ref: '#/components/responses/NoAutorizado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/EstadoNoPermite' }

#009-T024   /api/clubes/{clubId}/entrenamientos/{entrenamientoId}/jugadores:
#009-T024     parameters:
#009-T024       - $ref: '#/components/parameters/clubId'
#009-T024       - $ref: '#/components/parameters/entrenamientoId'
#009-T024     get:
#009-T024       tags: [Entrenamientos]
#009-T024       summary: NUEVO. Planilla del entrenamiento con respuestas y asistencia
#009-T024       description: |
#009-T024         PRESIDENTE y quien entrena alguna de sus categorías; los demás que lo ven, 403
#009-T024         `no_gestiona_actividad`; la cuenta de un jugador, 403 `rol_no_autorizado`. Quien entrena
#009-T024         solo algunas de sus categorías recibe solo los jugadores de esas (escenario 4.2).
#009-T024       responses:
#009-T024         '200':
#009-T024           description: La planilla
#009-T024           content:
#009-T024             application/json:
#009-T024               schema: { $ref: '#/components/schemas/PlanillaEntrenamientoDto' }
#009-T024         '401': { $ref: '#/components/responses/SinSesion' }
#009-T024         '403': { $ref: '#/components/responses/NoAutorizado' }
#009-T024         '404': { $ref: '#/components/responses/NoEncontrado' }

#009-T024   /api/clubes/{clubId}/entrenamientos/{entrenamientoId}/asistencia:
#009-T024     parameters:
#009-T024       - $ref: '#/components/parameters/clubId'
#009-T024       - $ref: '#/components/parameters/entrenamientoId'
#009-T024     put:
#009-T024       tags: [Entrenamientos]
#009-T024       summary: NUEVO. Registra o corrige la asistencia de los jugadores enviados
#009-T024       description: |
#009-T024         PRESIDENTE y quien entrena alguna de sus categorías, solo para los jugadores que puede
#009-T024         marcar (RF-022). Entrenamiento programado cuya fecha ya llegó; si no, 409
#009-T024         `entrenamiento_futuro` o `actividad_cancelada`. Un jugador fuera de su alcance, 409
#009-T024         `jugador_fuera_de_la_actividad`. Las filas no enviadas no cambian.
#009-T024       requestBody:
#009-T024         required: true
#009-T024         content:
#009-T024           application/json:
#009-T024             schema: { $ref: '#/components/schemas/RegistrarAsistenciaDto' }
#009-T024       responses:
#009-T024         '200':
#009-T024           description: La planilla actualizada
#009-T024           content:
#009-T024             application/json:
#009-T024               schema: { $ref: '#/components/schemas/PlanillaEntrenamientoDto' }
#009-T024         '400': { $ref: '#/components/responses/Validacion' }
#009-T024         '401': { $ref: '#/components/responses/SinSesion' }
#009-T024         '403': { $ref: '#/components/responses/NoAutorizado' }
#009-T024         '404': { $ref: '#/components/responses/NoEncontrado' }
#009-T024         '409': { $ref: '#/components/responses/EstadoNoPermite' }

#009-T025   /api/clubes/{clubId}/entrenamientos/{entrenamientoId}/mi-respuesta:
#009-T025     parameters:
#009-T025       - $ref: '#/components/parameters/clubId'
#009-T025       - $ref: '#/components/parameters/entrenamientoId'
#009-T025     put:
#009-T025       tags: [Entrenamientos]
#009-T025       summary: NUEVO. La familia dice si su jugador asistirá
#009-T025       description: |
#009-T025         Solo JUGADOR, sobre el jugador de la petición, en un entrenamiento de su categoría (RF-023).
#009-T025         Programado y sin empezar; si no, 409 `actividad_empezada` o `actividad_cancelada`.
#009-T025       requestBody:
#009-T025         required: true
#009-T025         content:
#009-T025           application/json:
#009-T025             schema: { $ref: '#/components/schemas/ResponderDto' }
#009-T025       responses:
#009-T025         '200':
#009-T025           description: Guardada
#009-T025           content:
#009-T025             application/json:
#009-T025               schema: { $ref: '#/components/schemas/EntrenamientoDto' }
#009-T025         '400': { $ref: '#/components/responses/Validacion' }
#009-T025         '401': { $ref: '#/components/responses/SinSesion' }
#009-T025         '403': { $ref: '#/components/responses/NoAutorizado' }
#009-T025         '404': { $ref: '#/components/responses/NoEncontrado' }
#009-T025         '409': { $ref: '#/components/responses/EstadoNoPermite' }

  # ------------------------------------------------------------------ Partidos

  /api/clubes/{clubId}/partidos:
    parameters:
      - $ref: '#/components/parameters/clubId'
    get:
      tags: [Partidos]
      summary: NUEVO. Partidos que quien pregunta puede ver
      description: |
        Cualquier rol. Los jugados, de todo el club; los próximos y cancelados, solo los visibles
        (RF-010, RF-019). Próximos por fecha ascendente; jugados y cancelados, descendente.
      parameters:
        - { name: estado, in: query, required: false, schema: { $ref: '#/components/schemas/EstadoPartido' } }
        - { name: categoriaId, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Partidos visibles
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PartidoResumenDto' }
        '401': { $ref: '#/components/responses/SinSesion' }
        '403': { $ref: '#/components/responses/NoAutorizado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
    post:
      tags: [Partidos]
      summary: NUEVO. Crea un partido próximo, sin convocados
      description: |
        PRESIDENTE, DIRECTIVO o ENTRENADOR; quien no es PRESIDENTE debe entrenar todas sus
        categorías (RF-008). Torneo sin nombre: 400 (escenario 2.10).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GuardarPartidoDto' }
      responses:
        '201':
          description: Creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PartidoDto' }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/SinSesion' }
        '403': { $ref: '#/components/responses/NoAutorizado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409':
          description: '`categoria_inactiva`'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }

  /api/clubes/{clubId}/partidos/{partidoId}:
    parameters:
      - $ref: '#/components/parameters/clubId'
      - $ref: '#/components/parameters/partidoId'
    get:
      tags: [Partidos]
      summary: NUEVO. Detalle de un partido
      description: |
        Quien lo ve. Jugado: rival, fecha, condición, tipo, torneo, marcador y goleadores del club
        para todos (RF-019). La cuenta de un jugador recibe además su propia respuesta.
      responses:
        '200':
          description: El partido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PartidoDto' }
        '401': { $ref: '#/components/responses/SinSesion' }
        '403': { $ref: '#/components/responses/NoAutorizado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
    put:
      tags: [Partidos]
      summary: NUEVO. Cambia los datos de un partido próximo
      description: |
        Quien lo gestiona. Solo en PROXIMO (research §16.2); las categorías no cambian (§16.1).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GuardarPartidoDto' }
      responses:
        '200':
          description: Cambiado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PartidoDto' }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/SinSesion' }
        '403': { $ref: '#/components/responses/NoAutorizado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/EstadoNoPermite' }

  /api/clubes/{clubId}/partidos/{partidoId}/cancelacion:
    parameters:
      - $ref: '#/components/parameters/clubId'
      - $ref: '#/components/parameters/partidoId'
    post:
      tags: [Partidos]
      summary: NUEVO. Cancela un partido próximo
      description: |
        Quien lo gestiona. Un partido jugado no se cancela (RF-021): 409 `partido_jugado`. Se puede
        deshacer con `DELETE` mientras no haya empezado (RF-038).
      responses:
        '200':
          description: Cancelado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PartidoDto' }
        '401': { $ref: '#/components/responses/SinSesion' }
        '403': { $ref: '#/components/responses/NoAutorizado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/EstadoNoPermite' }
    delete:
      tags: [Partidos]
      summary: NUEVO. Reactiva un partido cancelado
      description: |
        Quien lo gestiona, mientras no haya empezado y sus categorías sigan activas (RF-038).
        Vuelve a PROXIMO con sus categorías, su convocatoria y las respuestas como estaban. Si no
        está cancelado, 409 `actividad_no_cancelada`; si ya empezó, `actividad_empezada`; con una
        categoría desactivada, `categoria_inactiva`.
      responses:
        '200':
          description: Reactivado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PartidoDto' }
        '401': { $ref: '#/components/responses/SinSesion' }
        '403': { $ref: '#/components/responses/NoAutorizado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/EstadoNoPermite' }

  /api/clubes/{clubId}/partidos/{partidoId}/jugadores:
    parameters:
      - $ref: '#/components/parameters/clubId'
      - $ref: '#/components/parameters/partidoId'
    get:
      tags: [Partidos]
      summary: NUEVO. Planilla del partido con convocados, respuestas y quiénes jugaron
      description: |
        PRESIDENTE y quien entrena alguna de sus categorías (RF-010). La cuenta de un jugador, 403
        `rol_no_autorizado` (RF-012); un DIRECTIVO que no entrena ninguna, el 404 del partido
        próximo o 403 `no_gestiona_actividad` si está jugado.
      responses:
        '200':
          description: La planilla
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlanillaPartidoDto' }
        '401': { $ref: '#/components/responses/SinSesion' }
        '403': { $ref: '#/components/responses/NoAutorizado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /api/clubes/{clubId}/partidos/{partidoId}/convocatoria:
    parameters:
      - $ref: '#/components/parameters/clubId'
      - $ref: '#/components/parameters/partidoId'
    put:
      tags: [Partidos]
      summary: NUEVO. Deja la convocatoria exactamente con esos jugadores
      description: |
        Quien lo gestiona, en un partido PROXIMO. Cada jugador debe ser activo y de una de sus
        categorías (RF-009): si no, 409 `jugador_fuera_de_la_actividad`. Los que salen pierden su
        fila y su respuesta, sin rastro (RF-013).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GuardarConvocatoriaDto' }
      responses:
        '200':
          description: La planilla actualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlanillaPartidoDto' }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/SinSesion' }
        '403': { $ref: '#/components/responses/NoAutorizado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/EstadoNoPermite' }

  /api/clubes/{clubId}/partidos/{partidoId}/resultado:
    parameters:
      - $ref: '#/components/parameters/clubId'
      - $ref: '#/components/parameters/partidoId'
    put:
      tags: [Partidos]
      summary: NUEVO. Registra o corrige el resultado
      description: |
        Quien lo gestiona (RF-016). Partido PROXIMO que ya empezó, o JUGADO; si no, 409
        `partido_sin_empezar` o `actividad_cancelada`. Deja el partido JUGADO y guarda quién y
        cuándo (RF-020). Rechazos de RF-017 con 400: `goles_de_quien_no_jugo`,
        `goles_superan_marcador`, `jugador_no_convocado`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegistrarResultadoDto' }
      responses:
        '200':
          description: El partido jugado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PartidoDto' }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/SinSesion' }
        '403': { $ref: '#/components/responses/NoAutorizado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/EstadoNoPermite' }

#009-T025   /api/clubes/{clubId}/partidos/{partidoId}/mi-respuesta:
#009-T025     parameters:
#009-T025       - $ref: '#/components/parameters/clubId'
#009-T025       - $ref: '#/components/parameters/partidoId'
#009-T025     put:
