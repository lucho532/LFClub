<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>La Pecosa</title>
    <script>
      // Aplica el tema antes de pintar, para que la página no parpadee. Usa la misma clave y la
      // misma regla que src/compartido/tema/tema.ts: la elección guardada o, si no hay, el dispositivo.
      (function () {
        var tema = null;
        try {
          tema = localStorage.getItem('lapecosa.tema');
        } catch (error) {}
        if (tema !== 'claro' && tema !== 'oscuro') {
          var oscuro = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          tema = oscuro ? 'oscuro' : 'claro';
        }
        document.documentElement.setAttribute('data-tema', tema);

        // En la aplicación Android, la primera vez de cada apertura, el fondo es ya el del arranque
        // para que no se vea un destello antes de la animación. La misma clave que
        // src/arranque/debeMostrarArranque.ts; la animación quita la marca al terminar.
        try {
          var nativa = window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform();
          if (nativa && !sessionStorage.getItem('lapecosa.arranqueVisto')) {
            document.documentElement.setAttribute('data-arranque', '');
          }
        } catch (error) {}
      })();
    </script>
    <style>
      html[data-arranque],
      html[data-arranque] body {
        background: #231f1e;
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&display=swap"
    />
  </head>
  <body>
    <div id="raiz"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
