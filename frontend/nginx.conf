server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Archivos con huella en el nombre (los que genera Vite): no cambian nunca, se guardan un año.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Aplicación de una sola página: cualquier ruta que no sea un archivo devuelve index.html.
  # Ese HTML no se guarda sin revalidar: si se guardara, un teléfono que lo pidió antes de un
  # despliegue seguiría viendo la versión anterior (por ejemplo, un QR escaneado antes de publicar).
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
